<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>彩蛋预览</title>
<style>
  html,body{margin:0;height:100%;background:#f8fafc;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  #box{position:relative;width:480px;height:900px;margin:0 auto;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #err{position:absolute;left:12px;bottom:12px;font-size:12px;color:#dc2626;white-space:pre-wrap}
</style>
</head>
<body>
<div id="box"><canvas id="cv"></canvas><div id="err"></div></div>
<script src="../render/finale.js"></script>
<script>
  var cv = document.getElementById('cv');
  var box = document.getElementById('box');
  var q = new URLSearchParams(location.search);
  var at = parseFloat(q.get('t') || '');          // ?t=0.5 定格在某个进度
  ZJUFinale.load('../assets/finale/').then(function () {
    if (!isNaN(at)) {
      var w = box.clientWidth, h = box.clientHeight, dpr = 1;
      cv.width = w * dpr; cv.height = h * dpr;
      var g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      ZJUFinale.draw(g, w, h, at);
    } else {
      ZJUFinale.play({ canvas: cv, w: box.clientWidth, h: box.clientHeight, dpr: 1, duration: 2600 });
    }
  }).catch(function (e) {
    document.getElementById('err').textContent = '加载失败: ' + e.message;
  });
</script>
</body>
</html>
