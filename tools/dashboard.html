<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紫金港改造计划 · 数据看板</title>
<style>
:root{--bg:#0b0f14;--panel:#121920;--panel2:#161e26;--line:#232e39;--fg:#e8eef5;--dim:#8294a3;--gold:#ffd76a;--teal:#6fe0bd;--red:#ff8d7e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 600px at 20% -10%,#16212b,#0b0f14 60%);color:var(--fg);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:22px 26px 60px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
.sub{color:var(--dim);font-size:12px}
.spacer{flex:1}
.pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.02)}
button{font:inherit;font-size:12px;color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.08)}
button.on{color:#1d1607;background:var(--gold);border-color:var(--gold)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h2{font-size:13px;margin:0 0 14px;color:#b9c7d3;font-weight:600;letter-spacing:.04em}
.card h2 small{color:var(--dim);font-weight:400;margin-left:6px}
.card h2 .more{float:right;font-size:11.5px;color:var(--gold);text-decoration:none;font-weight:400;opacity:.85}
.card h2 .more:hover{opacity:1;text-decoration:underline}
.kpi{display:flex;gap:26px;flex-wrap:wrap}
.kpi div{display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--dim)}
.bars{display:flex;align-items:stretch;gap:10px;height:140px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0;height:100%}
.bar .track{flex:1 1 auto;width:100%;display:flex;align-items:flex-end;min-height:0}
.bar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#ffe08a,#c98b2e);min-height:2px}
.bar em{font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap}
.bar b{font-size:11px;color:#cdd9e3;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);color:var(--dim)}
.chip b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;padding:0 0 8px;letter-spacing:.06em}
td{padding:5px 0;border-top:1px solid rgba(255,255,255,.045)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.hm td.c{text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.hm td.d{color:#cfdae4;font-weight:600}
.tier{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tier span{display:flex;gap:2px;align-items:center}
.tier i{width:9px;height:4px;border-radius:1px;background:#28323d;display:block}
.tier i.on{background:var(--gold)}
.acts{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1b242d}
.acts .u{background:linear-gradient(90deg,#ffe08a,#e0a13c)}
.acts .d{background:rgba(255,141,126,.75)}
.grade{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;
  font-size:11px;font-weight:800;color:#1d1607;background:var(--gold)}
.grade.C{background:#8aa0b3}.grade.D{background:#6a7784}.grade.B{background:#a8d8a0}.grade.A{background:#ffd76a}
.empty{color:var(--dim);font-size:12px;padding:18px 0;text-align:center;line-height:1.8}
code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:5px;font-size:11.5px}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
.achrow{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:9px}
.achname{width:96px;color:#cfdae4}
.achtrack{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.achtrack i{display:block;height:100%;background:linear-gradient(90deg,#6fe0bd,#3fae8c);border-radius:4px}
.achnum{width:34px;text-align:right;color:#8294a3;font-variant-numeric:tabular-nums}
.opt{display:inline-block;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);
  border:1px solid #26313b;font-size:11px;color:#a9b8c6;margin:2px 3px 2px 0;line-height:1.5}
.opt b{color:var(--gold);margin-left:2px}
td.opts{max-width:420px;line-height:1.9}
.tag.live{color:var(--teal);border-color:rgba(111,224,189,.35);background:rgba(111,224,189,.08)}
.tag.off{color:#8c9aa6}
.hint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>紫金港改造计划 · 数据看板</h1>
  <span class="sub" id="updated">加载中…</span>
  <span class="spacer"></span>
  <span class="pill" id="liveTag">自动刷新</span>
  <button id="btnRefresh">刷新</button>
  <button id="btnAuto" class="on">每 3 秒</button>
</header>

<div class="grid">
  <section class="card" style="grid-column:1/-1">
    <h2>总览 <small id="evCount"></small></h2>
    <div class="kpi">
      <div><b id="kRuns">0</b><span>对局</span></div>
      <div><b id="kUsers">0</b><span>玩家</span></div>
      <div><b id="kDone">0%</b><span>完成率</span></div>
      <div><b id="kSteps">0</b><span>平均推进档数</span></div>
      <div><b id="kDur">0s</b><span>单局时长中位</span></div>
      <div><b id="kLeft">0</b><span>中途离开</span></div>
      <div><b id="kAnom">0</b><span>异常局</span></div>
    </div>
    <div class="hint" id="emptyHint" style="display:none"></div>
  </section>

  <section class="card">
    <h2>成就解锁 <small>按解锁次数排序</small></h2>
    <div id="achList"></div>
  </section>

  <section class="card">
    <h2>六维最终档位 <small>行 = 维度，列 = 最终 T1–T5</small></h2>
    <table class="hm" id="tierTable"></table>
    <div class="hint">颜色越亮 = 落在该档的人越多；最后一列是平均档位。</div>
  </section>

  <section class="card">
    <h2>加点行为 <small>每个维度被升 / 降档的次数</small></h2>
    <table id="actTable"></table>
  </section>

  <section class="card">
    <h2>封神专精 <small>谁选了哪条流派</small></h2>
    <table id="capTable"></table>
  </section>

  <section class="card">
    <h2>事件卡 <small>出现次数 / 选项分布</small></h2>
    <table id="cardTable"></table>
  </section>

  <section class="card">
    <h2>称号分布</h2>
    <table id="titleTable"></table>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>最近对局 <a class="more" href="/grades">按年级看 →</a><a class="more" href="/runs" style="margin-right:14px">管理每一局 →</a></h2>
    <table id="recentTable"></table>
  </section>
</div>

<script>
var META = null, auto = true, timer = null;

function el(id) { return document.getElementById(id); }
function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '—'; }
function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

function render(d) {
  META = META || d.meta;
  var t = d.totals;

  el('updated').textContent = '最后更新 ' + new Date(d.generatedAt).toLocaleTimeString('zh-CN');
  el('evCount').textContent = t.events + ' 条事件 · ' + t.runs + ' 局';
  el('kRuns').textContent = t.runs;
  el('kUsers').textContent = t.users;
  el('kDone').textContent = pct(t.finished, t.started);
  el('kSteps').textContent = t.avgSteps || '—';
  el('kDur').textContent = Math.round((d.duration.medianMs || 0) / 1000) + 's';
  el('kLeft').textContent = t.abandoned;
  if (el('kAnom')) el('kAnom').textContent = (t.anomalies || 0);

  var hint = el('emptyHint');
  if (!t.runs) {
    hint.style.display = 'block';
    hint.innerHTML = '还没有数据。去玩一局：打开游戏时带上 <code>?collect=http://127.0.0.1:8787/collect</code>，' +
      '或者把 <code>game/config.js</code> 里的 <code>TRACK.endpoint</code> 填成这个地址再打包。<br>' +
      '想先看看长什么样：<code>node tools/sample-data.js 40</code>';
  } else hint.style.display = 'none';

  // 成就解锁
  var ach = d.achievements || {};
  var achKeys = Object.keys(ach).sort(function (a, b) { return ach[b].count - ach[a].count; });
  var achMax = Math.max.apply(null, achKeys.map(function (k) { return ach[k].count; }).concat([1]));
  el('achList').innerHTML = achKeys.map(function (k) {
    var a = ach[k];
    var w = Math.round(a.count / achMax * 100);
    return '<div class="achrow"><span class="achname">' + esc(a.name) + '</span>' +
      '<span class="achtrack"><i style="width:' + w + '%"></i></span>' +
      '<span class="achnum">' + a.count + '</span></div>';
  }).join('');

  // 六维档位热力
  var dims = META.dims;
  var rows = ['<tr><th>维度</th><th style="text-align:center">T1</th><th style="text-align:center">T2</th><th style="text-align:center">T3</th><th style="text-align:center">T4</th><th style="text-align:center">T5</th><th style="text-align:right">均值</th></tr>'];
  var allMax = 1;
  dims.forEach(function (dm) {
    for (var i = 1; i <= 5; i++) allMax = Math.max(allMax, d.tiers[dm.id][i]);
  });
  dims.forEach(function (dm) {
    var x = d.tiers[dm.id];
    var tds = [1, 2, 3, 4, 5].map(function (i) {
      var v = x[i], a = v ? 0.12 + 0.55 * (v / allMax) : 0;
      return '<td class="c" style="background:rgba(255,215,106,' + a.toFixed(3) + ')">' + (v || '·') + '</td>';
    }).join('');
    rows.push('<tr><td class="d">' + dm.name + '</td>' + tds + '<td class="num">' + x.mean.toFixed(2) + '</td></tr>');
  });
  el('tierTable').innerHTML = rows.join('');

  // 加减点
  var maxAct = 1;
  dims.forEach(function (dm) {
    maxAct = Math.max(maxAct, d.actions.upgrades[dm.id] || 0, d.actions.downgrades[dm.id] || 0);
  });
  el('actTable').innerHTML = dims.map(function (dm) {
    var u = d.actions.upgrades[dm.id] || 0, dn = d.actions.downgrades[dm.id] || 0;
    var uw = Math.round(u / maxAct * 100), dw = Math.round(dn / maxAct * 100);
    return '<tr><td class="d" style="width:34px">' + dm.name + '</td>' +
      '<td><div class="acts"><div class="u" style="width:' + uw + '%"></div></div></td>' +
      '<td class="num" style="width:46px">+' + u + '</td>' +
      '<td><div class="acts"><div class="d" style="width:' + dw + '%"></div></div></td>' +
      '<td class="num" style="width:40px">−' + dn + '</td></tr>';
  }).join('');

  // 专精
  var capRows = [];
  dims.forEach(function (dm) {
    var o = d.caps[dm.id] || {};
    var ks = Object.keys(o);
    if (!ks.length) return;
    ks.forEach(function (k) {
      var name = k;
      (META.caps[dm.id] || []).forEach(function (c) { if (c.id === k) name = c.name; });
      capRows.push('<tr><td class="d" style="width:34px">' + dm.name + '</td><td>' + esc(name) + '</td><td class="num">' + o[k] + '</td></tr>');
    });
  });
  el('capTable').innerHTML = capRows.join('') || '<tr><td class="empty">还没有人选流派（要先升到 T5）</td></tr>';

  // 事件卡
  var cardRows = Object.keys(d.cards)
    .sort(function (a, b) { return d.cards[b].total - d.cards[a].total; })
    .map(function (id) {
      var c = d.cards[id];
      var keys = Object.keys(c.options).sort(function (a, b) { return c.options[b] - c.options[a]; });
      var opts = keys.map(function (k) {
        return '<span class="opt">' + esc(k) + ' <b>' + c.options[k] + '</b></span>';
      }).join('');
      var name = c.title || META.cards[id] || id;
      return '<tr><td style="width:150px;vertical-align:top">' + esc(name) +
        '<span class="tag">' + id + '</span></td>' +
        '<td class="num" style="width:48px;vertical-align:top">' + c.total + '</td>' +
        '<td class="opts">' + opts + '</td></tr>';
    });
  el('cardTable').innerHTML = cardRows.join('') || '<tr><td class="empty">还没有触发事件卡</td></tr>';

  // 称号
  var titleRows = Object.keys(d.titles).sort(function (a, b) { return d.titles[b] - d.titles[a]; })
    .map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="num">' + d.titles[k] + '</td></tr>'; });
  el('titleTable').innerHTML = titleRows.join('') || '<tr><td class="empty">还没有完成的局</td></tr>';

  // 最近对局
  var rRows = ['<tr><th>时间</th><th>成就</th><th>称号</th><th>六维</th><th style="text-align:right">时长</th></tr>'];
  (d.recent || []).forEach(function (r) {
    var pips = META.dims.map(function (dm) {
      var v = r.tiers[dm.id] || 0, bars = '';
      for (var i = 1; i <= 5; i++) bars += '<i class="' + (i <= v ? 'on' : '') + '"></i>';
      return '<span title="' + dm.name + ' T' + v + '">' + bars + '</span>';
    }).join('');
    rRows.push('<tr>' +
      '<td style="color:#8294a3;font-size:11px">' + new Date(r.ts).toLocaleTimeString('zh-CN') + '</td>' +
      '<td class="num">' + (r.achievements ? r.achievements.length : 0) + '</td>' +
      '<td>' + esc(r.title) + (r.finished ? '' : '<span class="tag off">离开</span>') + '</td>' +
      '<td><div class="tier">' + pips + '</div></td>' +
      '<td class="num">' + Math.round((r.durationMs || 0) / 1000) + 's</td></tr>');
  });
  el('recentTable').innerHTML = rRows.length > 1 ? rRows.join('') : '<tr><td class="empty">还没有对局</td></tr>';
}

function load() {
  fetch('/stats', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function (e) {
      el('updated').textContent = '读取失败：' + e.message;
    });
}

el('btnRefresh').onclick = load;
el('btnAuto').onclick = function () {
  auto = !auto;
  this.classList.toggle('on', auto);
  el('liveTag').className = 'pill' + (auto ? '' : '');
  if (auto) start(); else clearInterval(timer);
};
function start() { clearInterval(timer); timer = setInterval(load, 3000); }

load();
start();
</script>
</body>
</html>
