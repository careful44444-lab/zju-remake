<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备份管理</title>
<style>
:root{--bg:#f1f5f9;--panel:#121820;--line:#e2e8f0;--fg:#0f172a;--dim:#64748b;--gold:#d97706;--teal:#059669;--red:#e11d48}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 600px at 30% -10%,#eef2f7,#f1f5f9 60%);color:var(--fg);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:22px 26px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--dim)}
.spacer{flex:1}
button{font:inherit;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:rgba(15,23,42,.04);color:var(--fg)}
button:hover{background:rgba(15,23,42,.08)}
button.primary{background:linear-gradient(100deg,#d97706,#ea580c);color:#241a05;border:0;font-weight:700;padding:10px 18px}
button.danger{color:var(--red);border-color:rgba(225,29,72,.35)}
button.danger:hover{background:rgba(225,29,72,.12)}
button:disabled{opacity:.4;cursor:default}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(15,23,42,.02));
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;color:#475569;font-weight:600;letter-spacing:.04em}
.now{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline}
.now b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.now span{font-size:11px;color:var(--dim);display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;padding:0 8px 9px;letter-spacing:.06em;white-space:nowrap}
td{padding:9px 8px;border-top:1px solid rgba(15,23,42,.04);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.latest td{background:rgba(217,119,6,.04)}
.idx{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;
  background:rgba(15,23,42,.05);font-size:11px;color:#475569}
tr.latest .idx{background:var(--gold);color:#241a05;font-weight:800}
.note{width:100%;min-width:120px;background:rgba(0,0,0,.22);border:1px solid #e2e8f0;border-radius:8px;
  color:#334155;font:inherit;font-size:12px;padding:6px 9px}
.note:focus{outline:0;border-color:rgba(217,119,6,.5)}
.note::placeholder{color:#57636e}
.acts{display:flex;gap:6px;flex-wrap:nowrap}
.empty{color:var(--dim);font-size:12.5px;padding:22px 0;text-align:center;line-height:1.9}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-10px);padding:9px 18px;border-radius:999px;
  background:#ffffff;border:1px solid rgba(217,119,6,.4);color:var(--gold);
  font-size:13px;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:11.5px;color:var(--dim);line-height:1.9;margin:10px 0 0}
code{background:rgba(15,23,42,.05);padding:1px 6px;border-radius:5px;font-size:11.5px}
</style>
</head>
<body>

<header>
  <h1>备份管理</h1>
  <span class="sub" id="updated"></span>
  <span class="spacer"></span>
  <button class="primary" id="btnSnap">立即备份一份</button>
  <button id="btnRefresh">刷新</button>
</header>

<div class="card">
  <h2>当前正在收集的数据</h2>
  <div class="now" id="current"></div>
  <p class="hint">每 10 分钟会自动存一份快照（有变化才存）。恢复某一份备份时，当前数据会先被自动另存，所以回档也能反悔。</p>
</div>

<div class="card">
  <h2>所有备份 <span class="sub" id="cnt"></span></h2>
  <table>
    <thead>
      <tr>
        <th style="width:38px">#</th>
        <th style="width:150px">时间</th>
        <th style="width:56px">局数</th>
        <th style="width:64px">完成</th>
        <th style="width:64px">事件</th>
        <th style="width:64px">大小</th>
        <th>备注（可编辑）</th>
        <th style="width:300px">操作</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="emptyTip" class="empty" style="display:none">
    还没有备份。<br>点右上角「立即备份一份」，或者等自动备份。
  </div>
</div>

<div id="toast"></div>

<script>
var DATA = { items: [], current: null };

function $(id) { return document.getElementById(id); }
function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '—'; }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function fmtTime(iso) {
  var d = new Date(iso);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' +
    p(d.getHours()) + ':' + p(d.getMinutes());
}
function kb(n) { return n >= 1024 * 1024 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }

function render() {
  var c = DATA.current || { events: 0, runs: 0, finished: 0, users: 0, bytes: 0 };
  $('current').innerHTML =
    '<div><b>' + c.runs + '</b><span>局</span></div>' +
    '<div><b>' + c.finished + '</b><span>完成</span></div>' +
    '<div><b>' + c.events + '</b><span>事件</span></div>' +
    '<div><b>' + c.users + '</b><span>玩家</span></div>' +
    '<div><b>' + kb(c.bytes) + '</b><span>大小</span></div>' +
    '<div><b>' + pct(c.finished, c.runs) + '</b><span>完成率</span></div>';

  $('cnt').textContent = DATA.items.length ? '（' + DATA.items.length + ' 份）' : '';
  $('updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');

  var rows = $('rows');
  rows.innerHTML = '';
  if (!DATA.items.length) { $('emptyTip').style.display = 'block'; return; }
  $('emptyTip').style.display = 'none';

  DATA.items.forEach(function (it, i) {
    var tr = document.createElement('tr');
    if (i === 0) tr.className = 'latest';
    var idx = '<span class="idx">' + (i + 1) + '</span>';
    tr.innerHTML =
      '<td>' + idx + '</td>' +
      '<td style="color:#475569">' + fmtTime(it.at) + '</td>' +
      '<td class="num">' + it.runs + '</td>' +
      '<td class="num" style="color:#64748b">' + it.finished + '</td>' +
      '<td class="num" style="color:#64748b">' + it.events + '</td>' +
      '<td class="num" style="color:#64748b">' + kb(it.bytes) + '</td>' +
      '<td><input class="note" data-file="' + it.file + '" value="' +
        String(it.note || '').replace(/"/g, '&quot;') + '" placeholder="给这份起个名字，比如「内测第一轮」"></td>' +
      '<td><div class="acts">' +
        '<button data-act="restore" data-file="' + it.file + '">恢复到这份</button>' +
        '<button data-act="download" data-file="' + it.file + '">下载</button>' +
        '<button class="danger" data-act="delete" data-file="' + it.file + '">删除</button>' +
      '</div></td>';

    tr.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { act(b.dataset.act, b.dataset.file); };
    });
    var inp = tr.querySelector('.note');
    inp.onchange = function () {
      api({ action: 'note', file: inp.dataset.file, note: inp.value }, '备注已保存');
    };
    rows.appendChild(tr);
  });
}

function api(body, okMsg) {
  return fetch('/api/backups', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (r && r.items) { DATA.items = r.items; DATA.current = r.current; render(); }
    toast(r && r.msg ? r.msg : (okMsg || '完成'));
    return r;
  }).catch(function (e) { toast('失败：' + e.message); });
}

function act(what, file) {
  if (what === 'restore') {
    if (!confirm('把当前数据回档到这份？\n\n当前数据会先自动另存，可以再恢复回来。')) return;
    api({ action: 'restore', file: file });
  } else if (what === 'delete') {
    if (!confirm('删除这份备份？文件会被删掉，不能撤销。')) return;
    api({ action: 'delete', file: file });
  } else if (what === 'download') {
    location.href = '/download/' + encodeURIComponent(file);
  }
}

$('btnSnap').onclick = function () {
  var note = prompt('给这次备份起个名字（可留空）：');
  if (note === null) return;
  api({ action: 'snapshot', note: note }, '已备份');
};
$('btnRefresh').onclick = load;

function load() {
  fetch('/api/backups').then(function (r) { return r.json(); }).then(function (r) {
    DATA = r; render();
  }).catch(function (e) { toast('读取失败：' + e.message); });
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
