<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>按年级看</title>
<style>
:root{--bg:#f1f5f9;--panel:#121820;--line:#e2e8f0;--fg:#0f172a;--dim:#64748b;--gold:#d97706;--teal:#059669;--red:#e11d48}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 600px at 30% -10%,#eef2f7,#f1f5f9 60%);color:var(--fg);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:22px 26px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:19px;margin:0}
.spacer{flex:1}
button{font:inherit;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:rgba(15,23,42,.04);color:var(--fg)}
button:hover{background:rgba(15,23,42,.08)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(15,23,42,.02));
  border:1px solid var(--line);border-radius:16px;padding:14px 16px 4px;margin-bottom:16px}
.card h2{font-size:12.5px;margin:0 0 12px;color:#475569;font-weight:600;letter-spacing:.04em}
.kpis{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:4px}
.kpis div{display:flex;flex-direction:column;gap:2px}
.kpis b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis span{font-size:10.5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;padding:8px;letter-spacing:.05em;
  white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-top:1px solid rgba(15,23,42,.04);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.p:hover td{background:rgba(15,23,42,.03);cursor:pointer}
tr.detail td{background:rgba(15,23,42,.05);padding:14px 16px}
.yn{font-size:15px;font-weight:800;color:var(--gold)}
.bars{display:flex;gap:5px;align-items:flex-end;height:26px}
.bars i{width:8px;border-radius:2px;background:linear-gradient(180deg,#d97706,#c98b2e);display:block;min-height:2px}
.cmp{display:flex;flex-direction:column;gap:9px}
.cmp .row{display:flex;align-items:center;gap:12px;font-size:12px}
.cmp .nm{width:44px;color:#334155}
.cmp .track{flex:1;display:block;height:16px;background:rgba(15,23,42,.04);border-radius:8px;overflow:hidden}
.cmp .fill{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#d97706,#e0a13c);min-width:2px}
.cmp .val{width:60px;text-align:right;font-variant-numeric:tabular-nums;color:#334155}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tag.hot{color:var(--teal);border-color:rgba(5,150,105,.35)}
.runs{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:6px;background:rgba(15,23,42,.04);
  border:1px solid #e2e8f0;color:#475569}
.chip b{color:var(--gold)}
.empty{color:var(--dim);font-size:12.5px;padding:26px 0;text-align:center;line-height:1.9}
.grade{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;
  font-size:10.5px;font-weight:800;color:#1d1607;background:var(--gold)}
.grade.C{background:#8aa0b3}.grade.D{background:#94a3b8}.grade.B{background:#a8d8a0}.grade.A{background:#d97706}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-10px);padding:9px 18px;border-radius:999px;
  background:#ffffff;border:1px solid rgba(217,119,6,.4);color:var(--gold);
  font-size:13px;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <h1>按年级看</h1>
  <span class="spacer"></span>
  <button id="btnReload">刷新</button>
  <button onclick="location.href='/runs'">按局看 →</button>
  <button onclick="location.href='/dashboard'">← 看板</button>
</header>

<div class="card">
  <div class="kpis" id="kpis"></div>
</div>

<div class="card">
  <h2>各年级平均推进档数</h2>
  <div class="cmp" id="cmp"></div>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th style="width:70px">年级</th>
        <th style="width:56px">局数</th>
        <th style="width:64px">完成</th>
        <th style="width:90px">平均推进</th>
        <th style="width:74px">最多成就</th>
        <th style="width:130px">平均六维</th>
        <th style="width:118px">最舍得改</th>
        <th style="width:118px">最没人管</th>
        <th style="width:90px">最近</th>
        <th>最多称号</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="emptyTip" class="empty" style="display:none">还没有数据。玩一局再来。</div>
</div>

<div id="toast"></div>

<script>
var DATA = { runs: [], meta: null }, groups = [];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2000); }
function fmt(ts) { if (!ts) return '—'; var d = new Date(ts), p = function (n) { return String(n).padStart(2, '0'); };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function rel(ts) {
  var m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  var h = Math.floor(m / 60);
  return h < 24 ? h + ' 小时前' : Math.floor(h / 24) + ' 天前';
}

function group() {
  var years = DATA.meta.years || [];
  var buckets = {};
  years.forEach(function (y) { buckets[y.id] = { id: y.id, name: y.name, runs: [] }; });
  buckets.__none = { id: '', name: '未选', runs: [] };

  DATA.runs.forEach(function (r) {
    var b = buckets[r.year] || buckets.__none;
    b.runs.push(r);
  });

  groups = Object.keys(buckets).map(function (k) { return buckets[k]; })
    .filter(function (g) { return g.runs.length > 0; })
    .map(function (g) {
      var done = g.runs.filter(function (r) { return r.finished && !r.excluded; });
      var stepsList = done.map(function (r) {
        var n = 0; (DATA.meta.dims || []).forEach(function (d) { n += Math.max(0, ((r.tiers || {})[d.id] || 0) - (d.init || 0)); }); return n;
      });
      var avg = stepsList.length ? Math.round(stepsList.reduce(function (a, b) { return a + b; }, 0) / stepsList.length * 10) / 10 : 0;
      var best = done.reduce(function (m, r) { return Math.max(m, (r.achievements || []).length); }, 0);

      var avgTiers = {};
      (DATA.meta.dims || []).forEach(function (d) {
        var s = 0, n = 0;
        g.runs.forEach(function (r) { var v = (r.tiers || {})[d.id]; if (v) { s += v; n++; } });
        avgTiers[d.id] = n ? Math.round(s / n * 100) / 100 : 0;
      });
      var sorted = (DATA.meta.dims || []).slice().sort(function (a, b) { return avgTiers[b.id] - avgTiers[a.id]; });

      var tc = {};
      done.forEach(function (r) { if (r.title) tc[r.title] = (tc[r.title] || 0) + 1; });
      var titles = Object.keys(tc).sort(function (a, b) { return tc[b] - tc[a]; });

      return {
        id: g.id, name: g.name,
        runs: g.runs.slice().sort(function (a, b) { return b.ts - a.ts; }),
        count: g.runs.length, done: done.length,
        avg: avg, best: best, avgTiers: avgTiers,
        top: sorted[0], bottom: sorted[sorted.length - 1],
        title: titles[0] || '—',
        last: Math.max.apply(null, g.runs.map(function (r) { return r.ts; }))
      };
    });

  groups.sort(function (a, b) {
    var ia = years.findIndex ? years.findIndex(function (y) { return y.id === a.id; }) : 0;
    var ib = years.findIndex ? years.findIndex(function (y) { return y.id === b.id; }) : 0;
    return ia - ib;
  });
}

function render() {
  var total = DATA.runs.length;
  var best = groups.slice().sort(function (a, b) { return b.avg - a.avg; })[0];
  var worst = groups.filter(function (g) { return g.avg > 0; }).sort(function (a, b) { return a.avg - b.avg; })[0];

  $('kpis').innerHTML =
    '<div><b>' + total + '</b><span>总对局</span></div>' +
    '<div><b>' + groups.length + '</b><span>覆盖年级</span></div>' +
    '<div><b>' + (best ? best.name + ' ' + best.avg : '—') + '</b><span>推进最多</span></div>' +
    '<div><b>' + (worst ? worst.name + ' ' + worst.avg : '—') + '</b><span>推进最少</span></div>';

  var maxAvg = Math.max.apply(null, groups.map(function (g) { return g.avg; }).concat([1]));
  $('cmp').innerHTML = groups.map(function (g) {
    return '<div class="row"><span class="nm">' + esc(g.name) + '</span>' +
      '<span class="track"><span class="fill" style="width:' + Math.round(g.avg / maxAvg * 100) + '%"></span></span>' +
      '<span class="val">' + (g.avg || '—') + '</span></div>';
  }).join('');

  var rows = $('rows');
  rows.innerHTML = '';
  if (!groups.length) { $('emptyTip').style.display = 'block'; return; }
  $('emptyTip').style.display = 'none';

  groups.forEach(function (g) {
    var tr = document.createElement('tr');
    tr.className = 'p';
    var bars = (DATA.meta.dims || []).map(function (d) {
      var v = g.avgTiers[d.id] || 0;
      return '<i title="' + d.name + ' ' + v + '" style="height:' + Math.round(v / 5 * 100) + '%"></i>';
    }).join('');

    tr.innerHTML =
      '<td><span class="yn">' + esc(g.name) + '</span></td>' +
      '<td class="num">' + g.count + '</td>' +
      '<td class="num" style="color:#64748b">' + g.done + '</td>' +
      '<td class="num">' + (g.avg || '—') + ' 档</td>' +
      '<td class="num" style="color:#64748b">' + (g.best || 0) + ' 个</td>' +
      '<td><div class="bars">' + bars + '</div></td>' +
      '<td><span class="tag hot">' + g.top.name + ' T' + g.avgTiers[g.top.id] + '</span></td>' +
      '<td><span class="tag">' + g.bottom.name + ' T' + g.avgTiers[g.bottom.id] + '</span></td>' +
      '<td style="color:#64748b;font-size:11.5px">' + rel(g.last) + '</td>' +
      '<td style="color:#334155">' + esc(g.title) + '</td>';

    var dtr = document.createElement('tr');
    dtr.className = 'detail';
    dtr.style.display = 'none';
    var chips = g.runs.slice(0, 40).map(function (r) {
      return '<span class="chip">' + fmt(r.ts) +
        
        ' <b>' + (r.achievements || []).length + ' 成就</b></span>';
    }).join('');
    dtr.innerHTML = '<td colspan="10">' +
      '<div style="font-size:11px;color:#64748b;margin-bottom:8px">' +
        '「' + esc(g.name) + '」共 ' + g.count + ' 局 · ' +
        '<a href="/runs?year=' + encodeURIComponent(g.id) + '" style="color:#d97706">在对局管理里看这个年级 →</a>' +
      '</div><div class="runs">' + chips + '</div></td>';

    tr.onclick = function () {
      dtr.style.display = dtr.style.display === 'none' ? 'table-row' : 'none';
    };
    rows.appendChild(tr);
    rows.appendChild(dtr);
  });
}

function load() {
  fetch('/api/runs').then(function (r) { return r.json(); }).then(function (r) {
    DATA.runs = r.runs; DATA.meta = r.meta;
    group(); render();
  }).catch(function (e) { toast('读取失败：' + e.message); });
}

$('btnReload').onclick = load;
load();
</script>
</body>
</html>
