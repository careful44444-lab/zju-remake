<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文案编辑（离线版）</title>
<style>
:root{--bg:#f1f5f9;--line:#e2e8f0;--fg:#0f172a;--dim:#64748b;--gold:#d97706;--teal:#059669}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:var(--fg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 22px;background:#ffffff;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
h1{font-size:16px;margin:0}
.sub{font-size:11.5px;color:var(--dim)}
.spacer{flex:1}
button{font:inherit;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:rgba(15,23,42,.04);color:var(--fg)}
button:hover{background:rgba(15,23,42,.08)}
button.primary{background:linear-gradient(100deg,#d97706,#ea580c);color:#241a05;border:0;font-weight:700}
button.danger{color:#e11d48;border-color:rgba(225,29,72,.35)}
.wrap{display:flex;gap:20px;padding:20px 22px 80px;align-items:flex-start}
nav{position:sticky;top:70px;width:150px;flex:0 0 150px;display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;padding:8px 12px;font-size:13px}
nav button.on{background:rgba(217,119,6,.14);border-color:rgba(217,119,6,.45);color:var(--gold);font-weight:700}
main{flex:1;min-width:0}
.tier{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
  background:linear-gradient(180deg,rgba(15,23,42,.04),rgba(15,23,42,.02))}
.tier h3{margin:0 0 10px;font-size:13px;color:#475569;font-weight:600;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(217,119,6,.14);color:var(--gold)}
label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:13px;padding:9px 11px;border-radius:9px;
  background:rgba(15,23,42,.05);border:1px solid #e2e8f0;color:var(--fg)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,textarea:focus{outline:0;border-color:rgba(217,119,6,.5)}
.preview{margin-top:8px;border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;background:rgba(15,23,42,.04)}
.preview .t{font-size:16px;font-weight:800;margin-bottom:6px}
.preview .d{font-size:12.5px;color:#475569;line-height:1.7}
.preview .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.preview .tags span{font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(15,23,42,.04);border:1px solid #e2e8f0;color:#475569}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:10px 20px;border-radius:999px;
  background:#ffffff;border:1px solid rgba(217,119,6,.4);color:var(--gold);font-size:13px;font-weight:600;
  opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.hint{font-size:11.5px;color:var(--dim);line-height:1.8;margin:0 0 16px}
</style>
</head>
<body>
<script>
window.__IS_OFFLINE_EDITOR__ = true;
window.__BASE_FLAT__ = {"food":{"tiers":[{"title":"泡面纪元","desc":"打饭窗口只剩三个还开着，荤菜和素菜是同一种颜色。外卖柜比图书馆还热闹，宿舍楼下的电动车一天要充三次电。","tags":["窗口 3 个","队伍 35 分钟","人均 8 元"]},{"title":"温饱线","desc":"能吃饱，也能吃腻。每学期最后两周，全校都在等新窗口开张——开张那天排的队伍比开学典礼还长。","tags":["窗口 8 个","队伍 20 分钟","人均 12 元"]},{"title":"食堂的正常水平","desc":"有几道菜值得专门跑一趟，也有几道菜十年没换过。校外朋友来了，你会犹豫三秒，才决定带不带他去食堂。","tags":["窗口 15 个","队伍 10 分钟","人均 15 元"]},{"title":"食在浙大","desc":"本地人开始办卡进来蹭饭，美食博主把这里当取景地。你终于敢在饭桌上说一句：来浙大，我请你吃饭。","tags":["窗口 25 个","队伍 5 分钟","人均 20 元"]},{"title":"米其林紫金港","desc":"食堂开始有等位号、有季节菜单、有主厨。招生简章第一页是一碗面。隔壁学校的学生坐一小时地铁来吃午饭，吃完在门口拍照。","tags":["预约制","零排队","人均 30 元"]}],"caps":[{"name":"品质流 · 米其林紫金港","desc":"主厨、季节菜单、侍餐。你开始研究\"这道菜用的是哪家农场的菜\"，并且真的能查到。"},{"name":"性价比流 · 十元吃饱","desc":"十块钱三个菜一碗汤，米饭无限续。食堂门口挂着横幅：\"本月客流 6 万人次\"。没人拍照，但没人饿着。"}]},"dorm":{"tiers":[{"title":"八人间幸存者","desc":"热水限时，插座抽签，室友的闹钟和你的作息是两套时区。夜里十一点，走廊里有人用一口锅在煮全宿舍的宵夜。","tags":["热水 1 小时","人均 2.1㎡","23:30 断电"]},{"title":"标准六人间","desc":"该有的都有，只是都要排队。你练就了 30 秒洗完澡的核心竞争力，并且对\"公共洗衣机要等 40 分钟\"这件事毫无波澜。","tags":["热水看运气","人均 4.5㎡","23:00 熄灯"]},{"title":"正常宿舍","desc":"四人间、上床下桌、空调自由。室友关系从\"忍耐\"升级为\"还行\"，熄灯之后还能在桌上继续卷。","tags":["独立卫浴(部分)","人均 6㎡","不断电"]},{"title":"公寓级","desc":"电梯、洗衣房、公共厨房，楼下有个能通宵的自习室。你开始管宿舍叫\"家\"，回寝室不再是回\"那个地方\"。","tags":["独立卫浴","人均 12㎡","24h 热水"]},{"title":"一人一卫","desc":"独立卫浴、独立阳台、独立空调，室友只是来串门的。招生咨询时，家长问的第一个问题从\"多少分\"变成了\"宿舍什么样\"。","tags":["单人套间","人均 25㎡","想住多久住多久"]}],"caps":[{"name":"豪华流 · 一人一卫","desc":"落地窗、烘干机、地暖。缺点是：你越来越不想去教室，并且开始认真考虑读个博。"},{"name":"社交流 · 宿舍即客厅","desc":"每层一个公共客厅、一个桌游区、一个共享厨房。你四年认识的人比上课多，期末周的互助文档有 200 个编辑者。"}]},"move":{"tiers":[{"title":"校车玄学","desc":"你永远不知道下一班车什么时候来，就像你永远不知道教务系统什么时候崩。跨校区一趟，半天就没了，车上的人像被真空包装过。","tags":["等车 25 分钟","跨校区 70 分钟","单车 0 辆"]},{"title":"挤得上去算你赢","desc":"早八的校车是一块压缩饼干，你能在里面悬空站立 20 分钟，还腾出一只手回消息。上不去的人，会在群里收到一句\"下一班吧\"。","tags":["等车 12 分钟","跨校区 50 分钟","单车靠抢"]},{"title":"正常大学","desc":"校车按时发车，地铁就在门口。你偶尔还是会迟到，但那是你自己的问题，怪不到交通上。","tags":["等车 8 分钟","跨校区 35 分钟","有车可骑"]},{"title":"通勤自由","desc":"班次密到不用看时刻表，跨校区有直达专线。你开始敢选早八的课，并且真的能准时出现在教室里。","tags":["等车 4 分钟","跨校区 22 分钟","随处可停"]},{"title":"五分钟到教室","desc":"从宿舍到教室，导航显示 4 分 50 秒，你甚至能回宿舍拿个充电宝再出发。有人在校园里迷了路，因为他一直在坐车、从没走完过一圈。","tags":["等车 2 分钟","跨校区 10 分钟","校内小火车"]}],"caps":[{"name":"效率流 · 五分钟到教室","desc":"无人接驳车按需呼叫，三分钟到楼下。你的迟到理由少了一个，生活突然变得很难解释。"},{"name":"浪漫流 · 校园小火车","desc":"环湖一圈 18 分钟，有讲解员、有夕阳、有一节车厢专门用来发呆。迟到率上升了，幸福感也上升了。"}]},"study":{"tiers":[{"title":"抢课奥运会","desc":"选课系统在 12:00:00 崩了，你在 12:00:03 学会了接受命运。图书馆的座位要用书包、水杯、一张纸条三件套提前占住。","tags":["选课成功率 40%","座位靠抢","通宵室 1 个"]},{"title":"够用但不好用","desc":"一半的投影仪是坏的，另一半要自己带转接头。你想自习，得先想清楚去哪、几点去、以及要不要带充电宝和外套。","tags":["成功率 60%","常排队","通宵室 2 个"]},{"title":"正常水平","desc":"图书馆够大，教室够新，选课系统偶尔崩但你能忍。这就是大多数 985 应有的样子，你已经很知足。","tags":["成功率 75%","有座","通宵室 4 个"]},{"title":"学术氛围拉满","desc":"24 小时自习室、讨论间、座位预约系统，凌晨两点还有人在改论文。你开始为自己不够努力而感到一丝焦虑。","tags":["成功率 90%","随时有座","每栋楼都有"]},{"title":"24h 图书馆","desc":"凌晨三点的图书馆比白天还满，但你想坐哪就坐哪。选课系统开抢前会给你发短信，末尾还附一句\"祝你好运\"。","tags":["成功率 100%","永远有座","通宵不打烊"]}],"caps":[{"name":"卷王流 · 24h 图书馆","desc":"全年无休、四层通宵、咖啡免费。你已经分不清自己是来读书还是来上班的。"},{"name":"躺平流 · 不点名大学","desc":"出勤自由、作业自选、考试开卷。GPA 通胀了，睡眠也回来了，所有人看起来都健康了一点。"}]},"sport":{"tiers":[{"title":"体测恐怖片","desc":"一千米跑完，你在跑道边重新思考人生。体育馆的开放时间像谜语，永远和你的课表完美错开。","tags":["场馆 2 个","体测通过 62%","校园跑强制"]},{"title":"勉强及格","desc":"场地要抢，器械老得能进博物馆。你的主要运动量来自赶校车，以及一边爬楼一边看手机。","tags":["场馆 4 个","通过 78%","校园跑强制"]},{"title":"够用的体育","desc":"该有的场馆都有，跑道上永远有人在夜跑。体测依然让人破防，但至少操场是新的，灯是亮的。","tags":["场馆 8 个","通过 88%","自愿打卡"]},{"title":"运动自由","desc":"恒温泳池、攀岩墙、24 小时健身房。校队开始出现在全国赛场上，你开始出现在健身房镜子前。","tags":["场馆 15 个","通过 96%","积分换装备"]},{"title":"奥运场馆","desc":"场馆好到你开始怀疑自己配不配进来。体测变成了一场嘉年华，跑完还有人递运动饮料。隔壁学校来借场地，要提前半年预约。","tags":["场馆 30 个","通过 99%","场场爆满"]}],"caps":[{"name":"竞技流 · 奥运场馆","desc":"专业跑道、体能实验室、运动康复中心。你开始认真思考自己是不是错过了一条奥运赛道。"},{"name":"快乐流 · 随便玩","desc":"没有体测，没有打卡，只有草坪、飞盘和一群不想回宿舍的人。体育课变成了\"今天玩点什么\"。"}]},"culture":{"tiers":[{"title":"周末空城","desc":"周五晚上，整个校区安静得像在放寒假。社团活动中心的门锁着，公告栏上是三年前的海报，边角还翘着。","tags":["每周 2 场","社团 30 个","21:00 熄灯"]},{"title":"有活动，但没人去","desc":"海报贴了三天没人撕，因为也没人贴新的。你想参加点什么，翻了半小时公众号，最后回宿舍躺着。","tags":["每周 6 场","社团 60 个","22:00 散场"]},{"title":"正常的大学氛围","desc":"有音乐节，有讲座，有摆摊。你偶尔会去，大部分时候在宿舍刷手机看别人发的现场，然后点个赞。","tags":["每周 15 场","社团 120 个","23:00 收摊"]},{"title":"热闹起来","desc":"草坪上常年有活动，社团招新能堵住一条路。你开始烦恼的是\"今晚去哪个\"，而不是\"今晚干嘛\"。","tags":["每周 40 场","社团 200 个","通宵场"]},{"title":"永不落幕","desc":"周五到周日，草坪上同时有三场音乐节和一场诺奖讲座。有人为了活动专门考进来，有人为了活动舍不得毕业。","tags":["每天都有","社团 300 个","24h"]}],"caps":[{"name":"烟火流 · 音乐节","desc":"草坪、舞台、篝火，学期末那场音乐节能把整片湖岸坐满。宿舍楼下有人弹吉他到凌晨三点，没人投诉。"},{"name":"学术流 · 诺奖讲座","desc":"每周一位诺奖得主开讲，座位靠抢课系统分配。你开始习惯在食堂排队时和陌生人讨论超导。"}]},"__achievements":[{"id":"life","name":"生活区天堂","desc":"食和住都到 T4","cond":[{"t":"every","of":["food","dorm"],"min":4}]},{"id":"edu","name":"五育并举","desc":"学和体都到 T4","cond":[{"t":"every","of":["study","sport"],"min":4}]},{"id":"city","name":"城市校园","desc":"行和文都到 T4","cond":[{"t":"every","of":["move","culture"],"min":4}]},{"id":"noweak","name":"没有短板","desc":"六项都不低于 T3","cond":[{"t":"every","of":"*","min":3}]}],"__titles":[{"id":"utopia","name":"紫金港乌托邦","line":"你把浙大改成了一所学校该有的样子，也改成了一个传说。","cond":[{"t":"every","of":"*","min":5}]},{"id":"reverse","name":"反向改造第一人","line":"六个维度，你砍了六个。学校还在，你心态已经没了。","cond":[{"t":"every","of":"*","max":2}]},{"id":"textbook","name":"教科书级改造","line":"没有短板，没有短板，还是没有短板。评委会想给你发个奖。","cond":[{"t":"every","of":"*","min":4}]},{"id":"lopsided","name":"偏科的疯子","line":"你把一个维度改到了全国第一，然后把两个维度改没了。","cond":[{"t":"count","of":"*","n":1,"min":5},{"t":"count","of":"*","n":1,"max":2}]},{"id":"hexagon","name":"六边形战士","line":"每一项都及格，每一项都封不了神。稳，但没什么可吹的。","cond":[{"t":"every","of":"*","min":3}]},{"id":"solo","name":"单项封神","line":"有一项，你可以吹一辈子。别的，能过就行。","cond":[{"t":"count","of":"*","n":1,"min":5}]},{"id":"foodie","name":"你把钱都花在吃上了","line":"食堂封神，宿舍漏水，校车照旧。人生总要有所取舍。","cond":[{"t":"top","of":["food"]},{"t":"count","of":["dorm","move"],"n":1,"max":2}]},{"id":"meh","name":"就这样吧，反正也要毕业了","line":"改造这个词，有时候只是一种美好的愿望。","cond":[{"t":"every","of":"*","max":3}]},{"id":"minor","name":"小修小补的这一年","line":"没改出什么大动静，但你至少试过了。","cond":[]}],"__events":[{"id":"bus","title":"校车又晚点","text":"早八的校车晚了 25 分钟。站台上有人在啃早饭，有人在背单词，有人在群里问\"有没有人一起走回去\"。","options":[{"label":"加钱加密班次","cost":3,"result":"车来了，一次两辆，队伍短了一半。"},{"label":"算了，忍了","result":"全车的怨气凝结成了一种新的校园文化。","effect":{"tiers":{"move":-1}}}]},{"id":"donate","title":"校友捐赠到账","text":"一位不愿透露姓名的 98 级校友给学校打了笔钱，指定用于\"改善学生生活\"。","options":[{"label":"全部收下","result":"账上多了一笔预算，你可以假装没看见财务处的表情。","effect":{"points":4}}]},{"id":"fitness","title":"体测周","text":"本学期体测开始。一千米、引体向上、坐位体前屈，三件套齐活。","options":[{"label":"请教练特训","cost":2,"result":"教练说你的问题不在腿，在心态。但体测过了。"},{"label":"裸考","cond":{"dim":"sport","lt":3},"result":"一千米跑完，你在跑道边重新思考人生。","altResult":"场馆够好，你居然轻松过了。什么都没发生。","effect":{"points":-4}}]},{"id":"hair","title":"食堂吃出头发","text":"一位同学在食堂吃出了头发，照片已经传到了校园墙。评论区正在自动分成三派。","options":[{"label":"全额整改","cost":5,"result":"明厨亮灶 + 全流程抽检。一周后全校都忘了这件事。"},{"label":"让它上热搜","result":"学校连夜道歉，食堂连夜整改。你成了校园网红。","effect":{"points":2,"tiers":{"food":-1}}}]},{"id":"course","title":"选课系统崩了","text":"12:00:00 系统崩溃。12:00:03，教务处的电话被打爆。12:00:05，群里开始流传一张\"退学申请表\"表情包。","options":[{"label":"找教务哭着求扩容","cost":3,"item":"up","result":"服务器扩容了，下个学期再也没崩过（这次）。"},{"label":"硬着头皮抢","cond":{"dim":"study","lt":5},"result":"课没抢到，学分也没到手。","altResult":"你早就拿到预约了，全程围观别人崩溃。什么都没发生。","effect":{"tiers":{"study":-1}}}]},{"id":"influencer","title":"网红来打卡","text":"一位百万粉博主在校园里拍了一条视频，标题是《国内最美大学没有之一》。","options":[{"label":"安排接驳和拍摄许可","result":"视频爆了，报考咨询量涨了三成。","effect":{"tiers":{"culture":1},"cap":4}},{"label":"保持安静","result":"没有游客，没有排队，图书馆还是图书馆。","effect":{"points":2}}]},{"id":"flood","title":"暴雨淹了紫金港","text":"一场大雨，路面成河。有人划着充气船去上课，视频在群里转了三圈。","options":[{"label":"做排水改造","cost":4,"item":"x15","result":"海绵校园上线，下一场雨你甚至没带伞。"},{"label":"买双雨靴","result":"雨靴销量全校第一。","effect":{"tiers":{"move":-1}}}]},{"id":"roomie","title":"宿舍矛盾","text":"室友的闹钟响在 6:30，你的入睡时间是 2:30。第三个室友开始在群里发长文。","options":[{"label":"申请调换","cost":2,"result":"换了宿舍，新室友的闹钟响在 6:00。但你睡得更好了。"},{"label":"继续磨合","result":"你们达成了一个脆弱的协议，为期两周。","effect":{"tiers":{"dorm":-1}}}]},{"id":"bike","titl h","name":"就这样吧，反正也要毕业了","line":"改造这个词，有时候只是一种美好的愿望。","cond":[{"t":"every","of":"*","max":3}]},{"id":"minor","name":"小修小补的这一年","line":"没改出什么大动静，但你至少试过了。","cond":[]}],"dims":[{"id":"food","name":"食","sub":"食堂与餐饮"},{"id":"dorm","name":"住","sub":"宿舍与生活区"},{"id":"study","name":"学","sub":"课程与自习"},{"id":"sport","name":"体","sub":"场馆与体测"},{"id":"culture","name":"文","sub":"社团与风景"},{"id":"move","name":"行","sub":"校车与通勤"}],"tiers":[{"n":1,"name":"掉队","peer":"不如省属重点"},{"n":2,"name":"落后","peer":"双非里算好的"},{"n":3,"name":"合格","peer":"985 中游"},{"n":4,"name":"领先","peer":"华五前列"},{"n":5,"name":"封神","peer":"全国第一"}],"items":[{"id":"up","name":"升档卡","desc":"免费给任意一个维度升一档","type":"freeUp"},{"id":"x15","name":"1.5 倍卡","desc":"剩余点数 ×1.5，向上取整","type":"multiply","factor":1.5}]};

// 屏蔽 file:// 下会报错的历史 API，以及所有网络请求
try { history.replaceState = function () {}; } catch (e) { }
window.fetch = function (url, opts) {
  var u = String(url || "");
  if (u.indexOf("/content-edit") >= 0) {
    return Promise.resolve({ ok: true, json: function () { return Promise.resolve(window.__EDITOR_DATA__); } });
  }
  if (u.indexOf("/api/content") >= 0) {
    var body = {};
    try { body = JSON.parse((opts && opts.body) || "{}"); } catch (e) { }
    if (body.reset) {
      // 「导出改动清单」走这条
      download("文案改动清单-" + stamp() + ".md", buildDiffMd(), "text/markdown");
      return Promise.resolve({ json: function () { return Promise.resolve({ ok: true, msg: "已下载改动清单" }); } });
    }
    download("文案修改-" + stamp() + ".json", JSON.stringify(body.data || {}, null, 2), "application/json");
    return Promise.resolve({ json: function () { return Promise.resolve({ ok: true, msg: "已下载修改文件" }); } });
  }
  return Promise.resolve({ ok: false, json: function () { return Promise.resolve({}); } });
};

function stamp() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}

function download(name, text, mime) {
  try {
    var head = (mime.indexOf("markdown") >= 0) ? "\ufeff" : "";
    var blob = new Blob([head + text], { type: mime + ";charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) {
    alert("下载失败：" + e.message + "\n可以把下面的内容复制出来发给我");
  }
}

// 当前草稿 → 扁平格式（编辑器内部 buildPayload 的镜像）
function currentFlat() {
  var out = JSON.parse(JSON.stringify(window.__BASE_FLAT__));
  // 从 DOM 读当前值太重，直接读编辑器保存到 window 的引用（见下方 hook）
  if (window.__CURRENT_FLAT__) return window.__CURRENT_FLAT__;
  return out;
}

function buildDiffMd() {
  var base = window.__BASE_FLAT__, cur = window.__CURRENT_FLAT__ || base;
  var lines = ["# 文案改动清单", "", "生成时间：" + new Date().toLocaleString("zh-CN"), ""];
  var n = 0;
  var dimName = {};
  (window.__EDITOR_DATA__.dims || []).forEach(function (d) { dimName[d.id] = d.name; });

  Object.keys(base).forEach(function (k) {
    if (k.indexOf("__") === 0) return;
    var b = base[k], c = cur[k];
    if (!c) return;
    b.tiers.forEach(function (t, i) {
      var t2 = c.tiers[i] || {};
      var head = "## " + (dimName[k] || k) + " · T" + (i + 1) + " " + (t.title || "");
      var chunk = [];
      if ((t.title || "") !== (t2.title || "")) chunk.push("- 标题：`" + (t.title || "") + "` → **" + (t2.title || "") + "**");
      if ((t.desc || "") !== (t2.desc || "")) chunk.push("- 描述：\n  - 原：" + (t.desc || "") + "\n  - 新：" + (t2.desc || ""));
      var tg = (t.tags || []).join(" / "), tg2 = (t2.tags || []).join(" / ");
      if (tg !== tg2) chunk.push("- 标签：" + tg + " → " + tg2);
      if (chunk.length) { lines.push(head, ""); lines = lines.concat(chunk); lines.push(""); n++; }
    });
    (b.caps || []).forEach(function (cp, i) {
      var c2 = (c.caps || [])[i] || {};
      if ((cp.name || "") !== (c2.name || "") || (cp.desc || "") !== (c2.desc || "")) {
        lines.push("## " + (dimName[k] || k) + " · 封神专精 " + (i + 1), "");
        if ((cp.name || "") !== (c2.name || "")) lines.push("- 名称：`" + cp.name + "` → **" + c2.name + "**");
        if ((cp.desc || "") !== (c2.desc || "")) lines.push("- 描述：" + cp.desc + " → " + c2.desc);
        lines.push(""); n++;
      }
    });
  });

  (base.__events || []).forEach(function (be, i) {
    var ce = (cur.__events || [])[i] || {};
    var chunk = [];
    if ((be.title || "") !== (ce.title || "")) chunk.push("- 标题：`" + be.title + "` → **" + ce.title + "**");
    if ((be.text || "") !== (ce.text || "")) chunk.push("- 正文：\n  - 原：" + be.text + "\n  - 新：" + ce.text);
    (be.options || []).forEach(function (o, j) {
      var o2 = (ce.options || [])[j] || {};
      if ((o.label || "") !== (o2.label || "")) chunk.push("- 选项 " + (j + 1) + "：`" + o.label + "` → **" + o2.label + "**");
      if ((o.result || "") !== (o2.result || "")) chunk.push("- 选项 " + (j + 1) + " 结果：\n  - 原：" + (o.result || "") + "\n  - 新：" + (o2.result || ""));
    });
    if (chunk.length) { lines.push("## 事件卡 · " + (be.title || be.id), ""); lines = lines.concat(chunk); lines.push(""); n++; }
  });

  if (!n) lines.push("（没有检测到改动）");
  return lines.join("\n");
}
</script>

<header>
  <h1>文案编辑</h1>
  <span class="sub" id="stat">离线版 · 改完点「导出修改」，把下载的文件发回给负责人</span>
  <span class="spacer"></span>
  <button id="btnSave" class="primary">导出修改</button>
  <button id="btnReset">导出改动清单</button>
</header>

<div class="wrap">
  <nav id="nav"></nav>
  <main id="main">
    <p class="hint">左边选维度，右边逐条改。改完点「保存」，回到游戏刷新就能看到。</p>
  </main>
</div>

<div id="toast"></div>

<script>
var CONTENT = null, EVENTS = null, META = null, ACH = [], TITLES = [];
var cur = 'food';
var draft = {};   // { dimId: { tiers:[{title,desc,tags}], caps:[{name,desc}] } }

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2200); }

// 从服务端拿原始文案（serve.js 会把 content.js 读出来）
function load(){
  return fetch('/content-edit').then(function(r){return r.json();}).then(function(d){
    CONTENT = d.content; EVENTS = d.events; META = d; ACH = d.achievements || []; TITLES = d.titles || [];
    (META.dims||[]).forEach(function(dm){
      var c = CONTENT[dm.id];
      draft[dm.id] = {
        tiers: c.tiers.map(function(t){ return {title:t.title, desc:t.desc, tags:(t.tags||[]).join(' / ')}; }),
        caps:  c.caps.map(function(t){ return {name:t.name, desc:t.desc}; })
      };
    });
    if (location.hash === '#events') cur = 'events';
    if (location.hash === '#rules') cur = 'rules';
    buildNav(); render();
  });
}

function buildNav(){
  var nav = $('nav');
  nav.innerHTML = '';
  (META.dims||[]).forEach(function(dm){
    var b = document.createElement('button');
    b.textContent = dm.name + ' · ' + dm.sub;
    b.className = dm.id === cur ? 'on' : '';
    b.onclick = function(){ cur = dm.id; history.replaceState(null,'','#edit'); buildNav(); render(); };
    nav.appendChild(b);
  });
  var a2 = document.createElement('button');
  a2.textContent = '称号 / 成就';
  a2.className = cur === 'rules' ? 'on' : '';
  a2.onclick = function(){ cur = 'rules'; history.replaceState(null,'','#rules'); buildNav(); render(); };
  nav.appendChild(a2);

  var e = document.createElement('button');
  e.textContent = '事件卡';
  e.className = cur === 'events' ? 'on' : '';
  e.onclick = function(){ cur = 'events'; history.replaceState(null,'','#events'); buildNav(); render(); };
  nav.appendChild(e);
}

function render(){
  var main = $('main');
  if (cur === 'events') return renderEvents(main);
  if (cur === 'rules') return renderRules(main);

  var dm = (META.dims||[]).filter(function(x){ return x.id === cur; })[0];
  var d = draft[cur], c = CONTENT[cur];
  var html = '<p class="hint">「' + esc(dm.name) + ' · ' + esc(dm.sub) + '」——五档 + 两个封神专精</p>';

  d.tiers.forEach(function(t, i){
    var tierName = (META.tiers||[])[i] ? META.tiers[i].name : ('T' + (i+1));
    html += '<div class="tier">' +
      '<h3><span class="badge">T' + (i+1) + ' ' + esc(tierName) + '</span>' +
      '<span style="color:var(--dim);font-weight:400;font-size:11px">第 ' + (i+1) + ' 档</span></h3>' +
      '<label>标题</label><input type="text" data-dim="' + cur + '" data-kind="tier" data-i="' + i + '" data-f="title" value="' + esc(t.title) + '">' +
      '<label>描述</label><textarea data-dim="' + cur + '" data-kind="tier" data-i="' + i + '" data-f="desc">' + esc(t.desc) + '</textarea>' +
      '<label>数值标签（用空格或 / 分隔，显示在方块下方）</label>' +
      '<input type="text" data-dim="' + cur + '" data-kind="tier" data-i="' + i + '" data-f="tags" value="' + esc(t.tags) + '">' +
      '<div class="preview" id="pv-' + cur + '-' + i + '">' + previewHTML(t) + '</div>' +
      '</div>';
  });

  d.caps.forEach(function(cp, i){
    html += '<div class="tier">' +
      '<h3><span class="badge">封神专精 ' + (i===0?'A':'B') + '</span></h3>' +
      '<label>名称</label><input type="text" data-dim="' + cur + '" data-kind="cap" data-i="' + i + '" data-f="name" value="' + esc(cp.name) + '">' +
      '<label>描述</label><textarea data-dim="' + cur + '" data-kind="cap" data-i="' + i + '" data-f="desc">' + esc(cp.desc) + '</textarea>' +
      '</div>';
  });

  main.innerHTML = html;
  main.querySelectorAll('input,textarea').forEach(function(el){
    el.oninput = function(){
      var dim = el.dataset.dim, kind = el.dataset.kind, i = +el.dataset.i, f = el.dataset.f;
      if (kind === 'tier') {
        draft[dim].tiers[i][f] = el.value;
        if (f !== 'tags') {
          var pv = $('pv-' + dim + '-' + i);
          if (pv) pv.innerHTML = previewHTML(draft[dim].tiers[i]);
        }
      } else {
        draft[dim].caps[i][f] = el.value;
      }
    };
  });
}

function previewHTML(t){
  return '<div class="t">' + esc(t.title || '（标题）') + '</div>' +
    '<div class="d">' + esc(t.desc || '（描述）') + '</div>' +
    '<div class="tags">' + String(t.tags||'').split(/[\/、,，]/).map(function(x){ return x.trim(); })
      .filter(Boolean).map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
}

function clauseText(c){
  if (!c || !c.t) return '（无条件）';
  var ids = (!c.of || c.of === '*') ? (META.dims||[]).map(function(d){return d.id;}) : c.of;
  var names = ids.map(function(id){
    var d = (META.dims||[]).filter(function(x){return x.id===id;})[0];
    return d ? d.name : id;
  }).join('、');
  if (c.t === 'top') return names + ' 是最高的那一项';
  var rng = [];
  if (c.min != null) rng.push('≥ T' + c.min);
  if (c.max != null) rng.push('≤ T' + c.max);
  var body = names + ' ' + rng.join(' 且 ');
  if (c.t === 'count') return '至少 ' + (c.n||1) + ' 个满足：' + body;
  return body;
}

function clauseHTML(kind, i, ci, c){
  c = c || { t:'every', of:'*', min:4 };
  var ids = (!c.of || c.of === '*') ? (META.dims||[]).map(function(d){return d.id;}) : c.of;
  var typeOpts = [
    ['every','全部满足'], ['count','至少 N 个满足'], ['top','这个维度最高']
  ].map(function(x){ return '<option value="' + x[0] + '"' + (c.t===x[0]?' selected':'') + '>' + x[1] + '</option>'; }).join('');
  var minOpts = ['<option value="">—</option>'].concat([1,2,3,4,5].map(function(n){
    return '<option value="' + n + '"' + (c.min===n?' selected':'') + '>T' + n + '</option>';
  })).join('');
  var maxOpts = ['<option value="">—</option>'].concat([1,2,3,4,5].map(function(n){
    return '<option value="' + n + '"' + (c.max===n?' selected':'') + '>T' + n + '</option>';
  })).join('');
  var boxes = (META.dims||[]).map(function(d){
    return '<label style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px;color:#475569">' +
      '<input type="checkbox" data-k="' + kind + '" data-i="' + i + '" data-ci="' + ci + '" data-f="dim" value="' + d.id + '"' +
      (ids.indexOf(d.id) >= 0 ? ' checked' : '') + '>' + d.name + '</label>';
  }).join('');
  var needN = c.t === 'count' || c.t === 'top';
  return '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(15,23,42,.03)">' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<select data-k="' + kind + '" data-i="' + i + '" data-ci="' + ci + '" data-f="t" style="width:130px">' + typeOpts + '</select>' +
      (needN ? '<span style="font-size:11.5px;color:#64748b">至少</span><input type="number" min="1" max="6" value="' + (c.n||1) + '" data-k="' + kind + '" data-i="' + i + '" data-ci="' + ci + '" data-f="n" style="width:60px">' : '') +

function listOf(kind){ return kind === 'ach' ? ACH : TITLES; }

function bindRules(main){
  main.querySelectorAll('input[data-k],select[data-k]').forEach(function(el){
    var h = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'onchange' : 'oninput';
    el[h] = function(){
      var kind = el.dataset.k, i = +el.dataset.i, f = el.dataset.f;
      var item = listOf(kind)[i];
      if (!item) return;
      if (el.dataset.ci == null) { item[f] = el.value; return; }
      var c = item.cond[+el.dataset.ci];
      if (!c) return;
      if (f === 'dim') {
        var all = (META.dims||[]).map(function(d){return d.id;});
        var sel = all.filter(function(id){
          return main.querySelector('input[data-k="'+kind+'"][data-i="'+i+'"][data-ci="'+el.dataset.ci+'"][value="'+id+'"]').checked;
        });
        c.of = (sel.length === all.length) ? '*' : sel;
        render();
        return;
      }
      if (f === 'min' || f === 'max') { c[f] = el.value ? +el.value : null; render(); return; }
      if (f === 'n') { c.n = +el.value || 1; return; }
      if (f === 't') { c.t = el.value; render(); return; }
    };
  });
  main.querySelectorAll('[data-del-clause]').forEach(function(b){
    b.onclick = function(){
      var a = b.dataset.delClause.split('|'), kind = a[0], i = +a[1], ci = +a[2];
      listOf(kind)[i].cond.splice(ci, 1); render();
    };
  });
  main.querySelectorAll('[data-add-clause]').forEach(function(b){
    b.onclick = function(){
      var a = b.dataset.addClause.split('|'), kind = a[0], i = +a[1];
      var it = listOf(kind)[i];
      it.cond = it.cond || [];
      it.cond.push({ t:'every', of:'*', min:4 }); render();
    };
  });
  main.querySelectorAll('[data-del-ach]').forEach(function(b){
    b.onclick = function(){ if (!confirm('删掉这个成就？')) return; ACH.splice(+b.dataset.delAch, 1); render(); };
  });
  main.querySelectorAll('[data-del-title]').forEach(function(b){
    b.onclick = function(){ if (!confirm('删掉这个称号？')) return; TITLES.splice(+b.dataset.delTitle, 1); render(); };
  });
  main.querySelectorAll('[data-add-ach]').forEach(function(b){
    b.onclick = function(){
      ACH.push({ id: 'ach' + Date.now(), name: '新成就', desc: '', cond:[{ t:'every', of:'*', min:4 }] }); render();
    };
  });
  main.querySelectorAll('[data-add-title]').forEach(function(b){
    b.onclick = function(){
      TITLES.splice(Math.max(0, TITLES.length - 1), 0, { id: 'title' + Date.now(), name: '新称号', line: '', cond:[{ t:'every', of:'*', min:4 }] }); render();
    };
  });
  main.querySelectorAll('[data-move]').forEach(function(b){
    b.onclick = function(){
      var a = b.dataset.move.split('|'), i = +a[0], d = +a[1], j = i + d;
      if (j < 0 || j >= TITLES.length) return;
      var tmp = TITLES[i]; TITLES[i] = TITLES[j]; TITLES[j] = tmp; render();
    };
  });
}

var whenOpen = {};   // 记住哪些卡的条件块是展开的

// 条件改动后只刷新标题栏那行字，不重新渲染（避免输入框失焦）
function syncWhen(i){
  var el = document.querySelector('[data-sum="' + i + '"]');
  if (!el) return;
  var w = EVENTS[i].when;
  el.textContent = whenText(w);
  el.style.color = w ? "#b45309" : "#94a3b8";
}

function whenText(w){
  if (!w) return "不限制（任何情况都可能出现）";
  var parts = [];
  if (w.rounds && (w.rounds.min != null || w.rounds.max != null)) {
    var a = w.rounds.min != null ? w.rounds.min : 1;
    var b = w.rounds.max != null ? w.rounds.max : "末";
    parts.push("第 " + a + "–" + b + " 回合");
  }
  (w.dims || []).forEach(function(c){
    var d = (META.dims || []).filter(function(x){ return x.id === c.id; })[0];
    var nm = d ? d.name : c.id;
    if (c.min != null && c.max != null) parts.push(nm + " 在 T" + c.min + "–T" + c.max);
    else if (c.min != null) parts.push(nm + " ≥ T" + c.min);
    else if (c.max != null) parts.push(nm + " ≤ T" + c.max);
  });
  if (w.pointsMin != null) parts.push("剩余点数 ≥ " + w.pointsMin);
  return parts.length ? parts.join(" · ") : "不限制";
}

function whenBlock(ev, i){
  var w = ev.when || null;
  var on = !!w;
  var h = "<details" + (whenOpen[i] ? " open" : "") + " style=\"margin-top:14px;border-top:1px solid #e2e8f0;padding-top:10px\">" +
    "<summary style=\"cursor:pointer;font-size:12.5px;color:#334155;font-weight:600\">" +
      "触发条件　<span data-sum=\"" + i + "\" style=\"font-weight:400;color:" + (on ? "#b45309" : "#94a3b8") + "\">" + esc(whenText(w)) + "</span>" +
    "</summary>" +
    "<p style=\"font-size:11.5px;color:#64748b;margin:8px 0 10px;line-height:1.7\">" +
      "不满足条件时，这张卡不会在这一回合出现。" +
      "维度条件全部满足才触发；回合和点数留空表示不限。" +
    "</p>";

  // 回合范围
  var rmin = w && w.rounds && w.rounds.min != null ? w.rounds.min : "";
  var rmax = w && w.rounds && w.rounds.max != null ? w.rounds.max : "";
  h += "<div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end\">" +
    "<div><label style=\"margin-top:0\">从第几回合</label><input type=\"number\" min=\"1\" max=\"9\" style=\"width:90px\" data-ev=\"" + i + "\" data-w=\"rmin\" value=\"" + rmin + "\" placeholder=\"不限\"></div>" +
    "<div><label style=\"margin-top:0\">到第几回合</label><input type=\"number\" min=\"1\" max=\"9\" style=\"width:90px\" data-ev=\"" + i + "\" data-w=\"rmax\" value=\"" + rmax + "\" placeholder=\"不限\"></div>" +
    "<div><label style=\"margin-top:0\">剩余点数至少</label><input type=\"number\" min=\"0\" max=\"99\" style=\"width:110px\" data-ev=\"" + i + "\" data-w=\"pointsMin\" value=\"" + (w && w.pointsMin != null ? w.pointsMin : "") + "\" placeholder=\"不限\"></div>" +
  "</div>";

  // 维度条件
  h += "<label style=\"margin-top:14px\">维度条件（全部满足才触发）</label>";
  var dims = (w && w.dims) || [];
  if (!dims.length) h += "<p style=\"font-size:11.5px;color:#94a3b8;margin:2px 0 8px\">还没加维度条件</p>";
  dims.forEach(function(c, k){
    var opts = (META.dims || []).map(function(d){
      return "<option value=\"" + d.id + "\"" + (d.id === c.id ? " selected" : "") + ">" + d.name + "</option>";
    }).join("");
    h += "<div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px\">" +
      "<div><label style=\"margin-top:0\">维度</label><select style=\"width:110px\" data-ev=\"" + i + "\" data-w=\"dim\" data-wi=\"" + k + "\">" + opts + "</select></div>" +
      "<div><label style=\"margin-top:0\">最低档</label><input type=\"number\" min=\"1\" max=\"5\" style=\"width:80px\" data-ev=\"" + i + "\" data-w=\"dmin\" data-wi=\"" + k + "\" value=\"" + (c.min != null ? c.min : "") + "\" placeholder=\"不限\"></div>" +
      "<div><label style=\"margin-top:0\">最高档</label><input type=\"number\" min=\"1\" max=\"5\" style=\"width:80px\" data-ev=\"" + i + "\" data-w=\"dmax\" data-wi=\"" + k + "\" value=\"" + (c.max != null ? c.max : "") + "\" placeholder=\"不限\"></div>" +
      "<button type=\"button\" class=\"ghost\" style=\"padding:7px 12px;font-size:12px\" data-ev=\"" + i + "\" data-w=\"delDim\" data-wi=\"" + k + "\">删掉</button>" +
    "</div>";
  });
  h += "<div style=\"display:flex;gap:10px;margin-top:4px\">" +
    "<button type=\"button\" class=\"ghost\" style=\"padding:7px 14px;font-size:12px\" data-ev=\"" + i + "\" data-w=\"addDim\">+ 加一条维度条件</button>" +
    (on ? "<button type=\"button\" class=\"ghost\" style=\"padding:7px 14px;font-size:12px;color:#be123c;border-color:#fecdd3\" data-ev=\"" + i + "\" data-w=\"clear\">清空条件</button>" : "") +
  "</div>";
  h += "</details>";
  return h;
}

function bindWhen(main){
  main.querySelectorAll("[data-w]").forEach(function(el){
    var i = +el.dataset.ev, ev = EVENTS[i], w = el.dataset.w;
    var act = function(){
      if (!ev.when) ev.when = {};
      var W = ev.when;
      if (w === "addDim") { W.dims = W.dims || []; W.dims.push({ id: (META.dims[0]||{}).id, max: 2 }); whenOpen[i] = true; render(); return; }
      if (w === "delDim") { W.dims.splice(+el.dataset.wi, 1); cleanWhen(ev); whenOpen[i] = true; render(); return; }
      if (w === "clear") { ev.when = null; whenOpen[i] = true; render(); return; }
      if (w === "rmin" || w === "rmax") {
        W.rounds = W.rounds || {};
        var v = el.value === "" ? null : Math.max(1, +el.value);
        W.rounds[w === "rmin" ? "min" : "max"] = v;
        cleanWhen(ev); syncWhen(i); return;
      }
      if (w === "pointsMin") { W.pointsMin = el.value === "" ? null : Math.max(0, +el.value); cleanWhen(ev); syncWhen(i); return; }
      var k = +el.dataset.wi; W.dims = W.dims || []; W.dims[k] = W.dims[k] || {};
      if (w === "dim") { W.dims[k].id = el.value; syncWhen(i); return; }
      if (w === "dmin") { W.dims[k].min = el.value === "" ? null : Math.min(5, Math.max(1, +el.value)); cleanWhen(ev); syncWhen(i); return; }
      if (w === "dmax") { W.dims[k].max = el.value === "" ? null : Math.min(5, Math.max(1, +el.value)); cleanWhen(ev); syncWhen(i); return; }
    };
    el[el.tagName === "SELECT" ? "onchange" : "oninput"] = act;
    if (el.tagName === "BUTTON") el.onclick = act;
  });
}

// 全空的 when 直接扔掉，避免存一堆空对象
function cleanWhen(ev){
  var w = ev.when; if (!w) return;
  if (w.rounds && w.rounds.min == null && w.rounds.max == null) delete w.rounds;
  if (w.pointsMin == null) delete w.pointsMin;
  if (w.dims) {
    w.dims = w.dims.filter(function(c){ return c && (c.min != null || c.max != null); });
    if (!w.dims.length) delete w.dims;
  }
  if (!w.rounds && w.pointsMin == null && !w.dims) ev.when = null;
}

              '<div><label style="margin-top:0">最高到 B</label><input type="number" min="1" max="5" style="width:76px" data-ev="' + i + '" data-opt="' + k + '" data-f="randCap" value="' + ((rnd.effectB && rnd.effectB.cap) || 5) + '"></div>' +
            '</div>' +
            '<label>结果 B 文案</label><textarea data-ev="' + i + '" data-opt="' + k + '" data-f="randText">' + esc(rnd.resultB || '') + '</textarea>' +
            '<div style="font-size:11px;color:#64748b;margin:-4px 0 4px">B 的概率 = 1 − A = ' + (1 - (rnd.p != null ? rnd.p : 0.5)).toFixed(1) + '。启用后「条件」不再生效。</div>';
          }
          h += '</div>';
          return h;
        })() +
        (function(){
          var ee = o.elseEffect || {};
          var eeDim = Object.keys(ee.tiers || {})[0] || '';
          var eeDelta = eeDim ? ee.tiers[eeDim] : -1;
          var eeDimOpts = ['<option value="">不改档位</option>'].concat((META.dims||[]).map(function(d){
            return '<option value="' + d.id + '"' + (d.id === eeDim ? ' selected' : '') + '>' + d.name + '</option>';
          })).join('');
          var eeDeltaOpts = [1,-1,2,-2].map(function(x){
            return '<option value="' + x + '"' + (x === eeDelta ? ' selected' : '') + '>' + (x>0?'+':'') + x + '</option>';
          }).join('');
          return '<div style="margin-top:10px;padding:10px;border-radius:10px;background:#fef3c7">' +
            '<div style="font-size:12px;color:#b45309;font-weight:600;margin-bottom:8px">条件不满足时，数值也照常结算（不填 = 只换文案）</div>' +
            '<div style="display:flex;gap:14px;flex-wrap:wrap">' +
              '<div><label style="margin-top:0">点数增减</label><input type="number" min="-20" max="20" style="width:86px" data-ev="' + i + '" data-opt="' + k + '" data-f="elsePoints" value="' + (ee.points || 0) + '"></div>' +
              '<div><label style="margin-top:0">档位</label><select data-ev="' + i + '" data-opt="' + k + '" data-f="elseDim" style="width:110px">' + eeDimOpts + '</select></div>' +
              '<div><label style="margin-top:0">增减</label><select data-ev="' + i + '" data-opt="' + k + '" data-f="elseDelta" style="width:76px">' + eeDeltaOpts + '</select></div>' +
              '<div><label style="margin-top:0">最高到</label><input type="number" min="1" max="5" style="width:76px" data-ev="' + i + '" data-opt="' + k + '" data-f="elseCap" value="' + (ee.cap || 5) + '"></div>' +
            '</div>' +
          '</div>';
        })() +
        '<label>条件不满足时的文案（有条件的才需要）</label><textarea data-ev="' + i + '" data-opt="' + k + '" data-f="altResult">' + esc(o.altResult || '') + '</textarea>' +
      '</div>';
    });
    html += whenBlock(ev, i);
    html += '</div>';
  });
  main.innerHTML = html;
  main.querySelectorAll('input,textarea,select').forEach(function(el){
    if (el.dataset.w) return;            // 触发条件的控件由 bindWhen 负责
    var h = el.tagName === 'SELECT' ? 'onchange' : 'oninput';
    el[h] = function(){
      var i = +el.dataset.ev, o = EVENTS[i];
      if (el.dataset.opt == null) { o[el.dataset.f] = el.value; return; }
      var opt = o.options[+el.dataset.opt];
      var f = el.dataset.f;
      if (f === 'label' || f === 'result' || f === 'altResult') { opt[f] = el.value; return; }
      if (f === 'randOn') {
        if (el.checked) {
          opt.random = { p: 0.5, resultB: '', effectB: { points: 0, tiers: {} } };
        } else { opt.random = null; }
        render(); return;
      }
      if (f.indexOf('rand') === 0) {
        if (!opt.random) opt.random = { p: 0.5, resultB: '', effectB: { points: 0, tiers: {} } };
        if (!opt.random.effectB) opt.random.effectB = { points: 0, tiers: {} };
        if (f === 'randP') { opt.random.p = Math.max(0, Math.min(1, +el.value || 0)); return; }
        if (f === 'randText') { opt.random.resultB = el.value; return; }
        if (f === 'randPoints') { opt.random.effectB.points = +el.value || 0; return; }
        if (f === 'randCap') { opt.random.effectB.cap = Math.min(5, Math.max(1, +el.value || 5)); return; }
        if (f === 'randDim') {
          var dv2 = Object.keys(opt.random.effectB.tiers || {})[0];
          var dvv = dv2 ? opt.random.effectB.tiers[dv2] : -1;
          opt.random.effectB.tiers = {};
          if (el.value) opt.random.effectB.tiers[el.value] = dvv;
          render(); return;
        }
        if (f === 'randDelta') {
          var dd = Object.keys(opt.random.effectB.tiers || {})[0];
          if (!dd) return;
          opt.random.effectB.tiers[dd] = +el.value || -1;
          return;
        }
        return;
      }
      if (f === 'cost') { opt.cost = Math.max(0, +el.value || 0); return; }
      if (f === 'item') { opt.item = el.value || null; return; }
      if (f === 'points') { opt.effect.points = +el.value || 0; return; }
      if (f === 'cap') { opt.cap = Math.min(5, Math.max(1, +el.value || 5)); return; }
      if (f === 'dim') {
        var delta = Object.keys(opt.effect.tiers)[0];
        var dv = delta ? opt.effect.tiers[delta] : -1;
        opt.effect.tiers = {};
        if (el.value) opt.effect.tiers[el.value] = dv;
        return;
      }
      if (f === 'delta') {
        var did = Object.keys(opt.effect.tiers)[0];
        if (!did) return;
        opt.effect.tiers[did] = +el.value || -1;
        return;
      }
      if (f === 'condDim') {
        if (!el.value) { opt.cond = null; return; }
        opt.cond = { dim: el.value, lt: (opt.cond && opt.cond.lt) || 3 };
        return;
      }
      if (f.indexOf('else') === 0) {
        if (!opt.elseEffect) opt.elseEffect = { points: 0, tiers: {} };
        if (!opt.elseEffect.tiers) opt.elseEffect.tiers = {};
        if (f === 'elsePoints') { opt.elseEffect.points = +el.value || 0; return; }
        if (f === 'elseCap') { opt.elseEffect.cap = Math.min(5, Math.max(1, +el.value || 5)); return; }
        if (f === 'elseDim') {
          var ed0 = Object.keys(opt.elseEffect.tiers)[0];
          var edv = ed0 ? opt.elseEffect.tiers[ed0] : -1;
          opt.elseEffect.tiers = {};
          if (el.value) opt.elseEffect.tiers[el.value] = edv;
          return;
        }
        if (f === 'elseDelta') {
          var ed1 = Object.keys(opt.elseEffect.tiers)[0];
          if (!ed1) return;
          opt.elseEffect.tiers[ed1] = +el.value || -1;
          return;
        }
      }
      if (f === 'condLt') {
        if (!opt.cond) return;
        opt.cond.lt = Math.min(5, Math.max(1, +el.value || 3));
        return;
      }
    };
  });
  bindWhen(main);   // 放在通用监听之后，避免被覆盖
}

function buildPayload(){
  var out = {};
  Object.keys(draft).forEach(function(k){
    out[k] = {
      tiers: draft[k].tiers.map(function(t){
        return { title: t.title, desc: t.desc, tags: t.tags.split(/[\/、,，]/).map(function(x){return x.trim();}).filter(Boolean) };
      }),
      caps: draft[k].caps.map(function(c){ return { name: c.name, desc: c.desc }; })
    };
  });
  out.__achievements = ACH;
  out.__titles = TITLES;
  out.__events = EVENTS.map(function(ev){
    return { id: ev.id, title: ev.title, text: ev.text, when: ev.when || null,
      options: ev.options.map(function(o){
        if (typeof o === 'string') return { label: o, result: '' };
        return {
          label: o.label, cost: o.cost || 0, result: o.result || '',
          altResult: o.altResult || '',
          elseEffect: (o.elseEffect && (o.elseEffect.points || Object.keys(o.elseEffect.tiers || {}).length))
            ? { points: o.elseEffect.points || 0, tiers: o.elseEffect.tiers || {}, cap: o.elseEffect.cap || 5 }
            : null,
          cond: o.cond || null,
          effect: (o.effect && (o.effect.points || Object.keys(o.effect.tiers || {}).length))
            ? o.effect : null,
          cap: o.cap || 5,
          item: o.item || null,
          random: o.random ? {
            p: Math.max(0, Math.min(1, o.random.p != null ? o.random.p : 0.5)),
            resultB: o.random.resultB || '',
            effectB: {
              points: (o.random.effectB && o.random.effectB.points) || 0,
              tiers: (o.random.effectB && o.random.effectB.tiers) || {},
              cap: (o.random.effectB && o.random.effectB.cap) || 5
            }
          } : null
        };
      }) };
  });
  return out;
}

$('btnSave').onclick = function(){
  fetch('/api/content', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ data: buildPayload() })
  }).then(function(r){ return r.json(); }).then(function(r){
    toast(r.ok ? '已保存，回游戏刷新即可看到' : ('保存失败：' + (r.msg||'')));
    $('stat').textContent = r.ok ? '已保存 · 游戏刷新即生效' : $('stat').textContent;
  }).catch(function(e){ toast('保存失败：' + e.message); });
};

$('btnReset').onclick = function(){
  if (!confirm('还原成文件里的原始文案？这会清掉所有修改。')) return;
  fetch('/api/content', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ reset: true }) })
    .then(function(r){ return r.json(); }).then(function(){ toast('已还原'); setTimeout(function(){ location.reload(); }, 600); });
};

window.__hookDraft = function(){ try { window.__CURRENT_FLAT__ = buildPayload(); } catch(e){} };
document.addEventListener("input", window.__hookDraft, true);
document.addEventListener("change", window.__hookDraft, true);
setTimeout(window.__hookDraft, 800);

load().catch(function(e){ $('main').innerHTML = '<p class="hint">读取失败：' + esc(e.message) + '</p>'; });
</script>
