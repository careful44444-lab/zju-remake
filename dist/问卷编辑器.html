<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>问卷 · 紫金港改造计划</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --line:#e2e8f0; --fg:#0f172a; --dim:#64748b;
    --gold:#d97706; --red:#e11d48; --r:14px;
  }
  .hidden{display:none !important}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;font-size:13px}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fff;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  h1{font-size:17px;margin:0;font-weight:800}
  .sub{color:var(--dim);font-size:11.5px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--fg);
    padding:8px 14px;border-radius:10px;font-size:12.5px}
  button:hover{background:#f8fafc}
  button.primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
  button.primary:hover{background:#b45309}
  button.danger{color:var(--red);border-color:#fecdd3}
  button.ghost{background:#fff}
  main{max-width:860px;margin:0 auto;padding:20px 22px 80px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .card h2{margin:0 0 4px;font-size:13.5px;font-weight:700}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.7;margin:6px 0 0}
  label{display:block;font-size:11.5px;color:var(--dim);margin:14px 0 5px;font-weight:600}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:13px;padding:9px 11px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);outline:0}
  input[type=text]:focus,textarea:focus,select:focus{border-color:rgba(217,119,6,.5)}
  textarea{resize:vertical;line-height:1.7}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .qno{width:26px;height:26px;border-radius:8px;background:#fffbeb;color:#b45309;
    display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto}
  .qhead select{width:130px;flex:0 0 auto}
  .qhead .spacer{flex:1}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row > div{flex:1;min-width:190px}
  .foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 22px;display:flex;gap:10px;justify-content:center}
  #toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#0f172a;color:#fff;
    padding:9px 18px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
  .chk{display:flex;align-items:center;gap:8px;font-size:12px;color:#334155;margin-top:12px}
  .chk input{width:auto}
.mini{min-width:30px;padding:4px 8px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:#334155}
.mini:hover:not(:disabled){background:#f1f5f9}
.mini:disabled{opacity:.35;cursor:not-allowed}
</style>
<script>
window.__IS_OFFLINE_SURVEY__ = true;
window.__SURVEY_BASE__ = {"intro":"还有几个问题想问问你（都可以跳过）","outro":"谢谢。你的想法会和这一局的数据一起，被收进统计里。","questions":[{"id":"q2","type":"choice","title":"在六个维度的初始挡位中，你觉得哪个需要调整","options":["食","住","学","体","文","行"],"allowText":true,"textHint":"高了还是低了？","placeholder":""},{"id":"q8","type":"text","title":"不拘泥于这六个维度，你心中的理想紫金港，还缺什么？","options":[],"allowText":false,"textHint":"","placeholder":"随便写一句也行"}]};

// 离线时把「保存」变成「导出」：所有网络请求都拦下来
window.fetch = function (url, opts) {
  var u = String(url || "");
  if (u.indexOf("/api/survey") >= 0) {
    if (opts && opts.method === "POST") {
      var body = {};
      try { body = JSON.parse(opts.body || "{}"); } catch (e) { }
      window.__CURRENT__ = body;
      download("问卷-" + stamp() + ".json", JSON.stringify(body, null, 2));
      return Promise.resolve({ ok: true, json: function () {
        return Promise.resolve({ ok: true, msg: "已导出，把这个文件发回给项目负责人" });
      } });
    }
    var cur = window.__CURRENT__ || window.__SURVEY_BASE__;
    return Promise.resolve({ ok: true, json: function () {
      return Promise.resolve(JSON.parse(JSON.stringify(cur)));
    } });
  }
  return Promise.resolve({ ok: false, json: function () { return Promise.resolve({}); } });
};

function stamp() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}

function download(name, text) {
  try {
    var blob = new Blob([text], { type: "application/json;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { alert("下载失败：" + e.message); }
}

// 离线版没有服务器，把「← 后台」藏掉，并改一下顶部说明
document.addEventListener("DOMContentLoaded", function () {
  var back = document.querySelector('button[onclick*="/admin"]');
  if (back) back.style.display = "none";
  var sub = document.querySelector(".sub");
  if (sub) sub.textContent = "离线版 · 改完点「导出 JSON」，把文件发回给项目负责人";
  var s1 = document.getElementById("btnSave"), s2 = document.getElementById("btnSave2");
  if (s1) s1.textContent = "保存并导出";
  if (s2) s2.textContent = "保存并导出";
});
</script>
</head>
<body>
<header>
  <h1>问卷</h1>
  <span class="sub">存在 data/survey.json · 保存后游戏刷新即生效 · 打包时会内联进单文件</span>
  <span class="spacer"></span>
  <button class="primary" id="btnSave">保存</button>
  <button id="btnExport">导出 JSON</button>
  <button id="btnReload">重新读取</button>
  <button onclick="location.href='/admin'">← 后台</button>
</header>

<main>
  <div class="card">
    <h2>开场与结束语</h2>
    <label>进入问卷时显示</label>
    <input type="text" id="intro" placeholder="还有几个问题想问问你（都可以跳过）">
    <label>提交后显示</label>
    <input type="text" id="outro" placeholder="谢谢，你的想法会被收进统计。">
  </div>

  <div id="list"></div>

  <div class="card" style="text-align:center">
    <button id="btnAdd">+ 加一道题</button>
    <p class="hint">建议 2–3 道。选项题完成率最高，纯文本题留一道就够。</p>
  </div>
</main>

<div class="foot">
  <button class="primary" id="btnSave2">保存</button>
  <button id="btnExport2">导出 JSON</button>
</div>
<div id="toast"></div>

<script>
var DATA = { intro: '', outro: '', questions: [] };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function render(){
  $('intro').value = DATA.intro || '';
  $('outro').value = DATA.outro || '';
  $('list').innerHTML = DATA.questions.map(function(q, i){
    var isChoice = q.type !== 'text';
    return '<div class="card" data-i="' + i + '">' +
      '<div class="qhead">' +
        '<span class="qno">' + (i + 1) + '</span>' +
        '<select data-f="type" data-i="' + i + '">' +
          '<option value="choice"' + (isChoice ? ' selected' : '') + '>选项题</option>' +
          '<option value="text"' + (!isChoice ? ' selected' : '') + '>纯文本</option>' +
        '</select>' +
        '<span class="spacer"></span>' +
        '<button class="mini" data-up="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="上移">↑</button>' +
        '<button class="mini" data-down="' + i + '"' + (i === DATA.questions.length - 1 ? ' disabled' : '') + ' title="下移">↓</button>' +
        '<button class="danger" data-del="' + i + '">删除</button>' +
      '</div>' +
      '<label>题目</label>' +
      '<input type="text" data-f="title" data-i="' + i + '" value="' + esc(q.title) + '" placeholder="这一局里，你最先放弃的是哪个维度？">' +
      (isChoice ? (
        '<label>选项（一行一个，或用逗号分隔）</label>' +
        '<textarea data-f="options" data-i="' + i + '" rows="3">' + esc((q.options || []).join('\n')) + '</textarea>' +
        '<div class="chk"><input type="checkbox" data-f="allowText" data-i="' + i + '"' + (q.allowText ? ' checked' : '') + '>' +
          '<span>允许补充一句（选填）</span></div>' +
        '<label>补充框的提示语</label>' +
        '<input type="text" data-f="textHint" data-i="' + i + '" value="' + esc(q.textHint || '') + '" placeholder="说说为什么（选填）">'
      ) : (
        '<label>输入框占位提示</label>' +
        '<input type="text" data-f="placeholder" data-i="' + i + '" value="' + esc(q.placeholder || '') + '" placeholder="随便写一句也行">'
      )) +
    '</div>';
  }).join('');

  document.querySelectorAll('[data-f]').forEach(function(el){
    var h = (el.type === 'checkbox' || el.tagName === 'SELECT') ? 'onchange' : 'oninput';
    el[h] = function(){
      var i = +el.dataset.i, f = el.dataset.f, q = DATA.questions[i];
      if (!q) return;
      if (f === 'options') { q.options = el.value.split(/[\n,，、]/).map(function(s){ return s.trim(); }).filter(Boolean); return; }
      if (f === 'allowText') { q.allowText = el.checked; return; }
      if (f === 'type') { q.type = el.value; render(); return; }
      q[f] = el.value;
    };
  });
  document.querySelectorAll('[data-up],[data-down]').forEach(function(b){
    b.onclick = function(){
      var up = b.dataset.up !== undefined;
      var i = +(up ? b.dataset.up : b.dataset.down);
      var j = i + (up ? -1 : 1);
      if (j < 0 || j >= DATA.questions.length) return;
      var tmp = DATA.questions[i];
      DATA.questions[i] = DATA.questions[j];
      DATA.questions[j] = tmp;
      render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = function(){
      if (!confirm('删掉第 ' + (+b.dataset.del + 1) + ' 题？')) return;
      DATA.questions.splice(+b.dataset.del, 1);
      render();
    };
  });
}

$('btnAdd').onclick = function(){
  DATA.questions.push({
    id: 'q' + (DATA.questions.length + 1),
    type: 'choice', title: '', options: ['食','住','学','体','文','行'],
    allowText: true, textHint: '说说为什么（选填）', placeholder: ''
  });
  render();
};

function save(){
  DATA.intro = $('intro').value;
  DATA.outro = $('outro').value;
  // 补 id
  DATA.questions.forEach(function(q, i){ if (!q.id) q.id = 'q' + (i + 1); });
  fetch('/api/survey', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(DATA)
  }).then(function(r){ return r.json(); }).then(function(r){
    toast(r.ok ? '已保存，游戏刷新即生效' : ('保存失败：' + (r.msg || '')));
  }).catch(function(e){ toast('保存失败：' + e.message); });
}
function stamp(){
  var d = new Date(), p = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

function download(name, text){
  try {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { alert('下载失败：' + e.message); return false; }
}

function exportJson(){
  DATA.intro = $('intro').value;
  DATA.outro = $('outro').value;
  DATA.questions.forEach(function(q, i){ if (!q.id) q.id = 'q' + (i + 1); });
  if (download('问卷-' + stamp() + '.json', JSON.stringify(DATA, null, 2))) {
    toast('已导出，把这个文件发给项目负责人');
  }
}

$('btnSave').onclick = save;
$('btnExport').onclick = exportJson;
$('btnExport2').onclick = exportJson;
$('btnSave2').onclick = save;

$('btnReload').onclick = load;

function load(){
  return fetch('/api/survey', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(d){
    DATA = d || { intro: '', outro: '', questions: [] };
    if (!Array.isArray(DATA.questions)) DATA.questions = [];
    render();
  });
}
load().catch(function(e){ toast('读取失败：' + e.message); });
</script>
</body>
</html>
